<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>物件一覧ポータル</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <script src="https://unpkg.com/lucide@0.400.0/dist/umd/lucide.js"></script>
</head>
<body>
<script>
    function parsePrice(priceStr) {
        if (!priceStr) return 0;
        return parseInt(priceStr.replace(/[^0-9]/g, ''), 10) || 0;
    }

    function sortCards(order, event) {
        if (event) event.preventDefault();
        const container = document.getElementById('cardList');
        const cards = Array.from(container.children);

        const firstPositions = new Map();
        cards.forEach(card => firstPositions.set(card, card.getBoundingClientRect().top));

        cards.sort((a, b) => {
            const priceA = parsePrice(a.getAttribute('data-price'));
            const priceB = parsePrice(b.getAttribute('data-price'));
            return order === 'asc' ? priceA - priceB : priceB - priceA;
        });

        cards.forEach(card => container.appendChild(card));

        cards.forEach(card => {
            const newTop = card.getBoundingClientRect().top;
            const oldTop = firstPositions.get(card);
            const delta = oldTop - newTop;

            card.style.transition = 'none';
            card.style.transform = `translateY(${delta}px)`;
        });

        requestAnimationFrame(() => {
            cards.forEach(card => {
                card.style.transition = 'transform 0.4s ease';
                card.style.transform = 'translateY(0)';
            });
        });

        const dropdown = document.querySelector('.sort-dropdown');
        if (dropdown) dropdown.removeAttribute('open');
    }

    function getFavorites() {
        const saved = localStorage.getItem('favoriteProperties');
        return saved ? JSON.parse(saved) : [];
    }

    function saveFavorites(favorites) {
        localStorage.setItem('favoriteProperties', JSON.stringify(favorites));
    }

    function toggleFavorite(event, btn) {
        event.preventDefault();
        event.stopPropagation();

        const card = btn.closest('.card-link');
        const id = card.getAttribute('data-id');
        let favorites = getFavorites();

        if (favorites.includes(id)) {
            favorites = favorites.filter(favId => favId !== id);
            btn.classList.remove('active');
        } else {
            favorites.push(id);
            btn.classList.add('active');
        }
        btn.innerHTML = '<i data-lucide="star"></i>';
        lucide.createIcons();

        saveFavorites(favorites);
    }

    function applyFavoriteState() {
        const favorites = getFavorites();
        document.querySelectorAll('.card-link').forEach(card => {
            const id = card.getAttribute('data-id');
            const btn = card.querySelector('.favorite-btn');
            if (favorites.includes(id)) {
                btn.classList.add('active');
            }
        });
    }

    function applyFavoritesFilter() {
        const params = new URLSearchParams(window.location.search);
        if (params.get('favorites') !== 'true') return;

        const favorites = getFavorites();
        const cards = document.querySelectorAll('.card-link');
        let visibleCount = 0;

        cards.forEach(card => {
            const id = card.getAttribute('data-id');
            if (favorites.includes(id)) {
                card.style.display = '';
                visibleCount++;
            } else {
                card.style.display = 'none';
            }
        });

        const countEl = document.getElementById('resultCount');
        if (countEl) countEl.textContent = visibleCount;

        const h1 = document.querySelector('h1');
        if (h1) {
            h1.innerHTML = `★ お気に入り一覧 (<span id="resultCount">${visibleCount}</span>件)`;
        }

        const favLink = document.querySelector('.favorites-link');
        if (favLink) favLink.style.display = 'none';

        if (visibleCount === 0) {
            const cardList = document.getElementById('cardList');
            const emptyMsg = document.createElement('p');
            emptyMsg.textContent = 'お気に入りに登録された物件はまだありません。';
            emptyMsg.className = 'empty-message';
            cardList.appendChild(emptyMsg);
        }
    }

    document.addEventListener('DOMContentLoaded', () => {
        applyFavoriteState();
        applyFavoritesFilter();
        lucide.createIcons();
    });
</script>

<header>
    <div class="container">
        <h1> 検索結果 (<span id="resultCount" th:text="${properties.size()}">4</span>件)</h1>
        <a th:href="@{/property(favorites=true)}" class="favorites-link">★ お気に入り一覧</a>
        <form th:action="@{/property}" method="get" class="search-form">
            <input type="text" name="keyword" placeholder="物件名や地域で検索" th:value="${keyword}">
            <button type="submit">検索</button>
        </form>

        <form th:action="@{/property}" method="get" class="filter-form">
            <input type="hidden" name="keyword" th:value="${keyword}">

            <select name="area">
                <option value="">エリアを選択</option>
                <option value="港区" th:selected="${currentArea == '港区'}">港区</option>
                <option value="渋谷区" th:selected="${currentArea == '渋谷区'}">渋谷区</option>
                <option value="新宿区" th:selected="${currentArea == '新宿区'}">新宿区</option>
                <option value="世田谷区" th:selected="${currentArea == '世田谷区'}">世田谷区</option>
                <option value="中野区" th:selected="${currentArea == '中野区'}">中野区</option>
                <option value="目黒区" th:selected="${currentArea == '目黒区'}">目黒区</option>
                <option value="杉並区" th:selected="${currentArea == '杉並区'}">杉並区</option>
                <option value="台東区" th:selected="${currentArea == '台東区'}">台東区</option>
                <option value="足立区" th:selected="${currentArea == '足立区'}">足立区</option>
                <option value="武蔵野市" th:selected="${currentArea == '武蔵野市'}">武蔵野市</option>
                <option value="川崎市" th:selected="${currentArea == '川崎市'}">川崎市(武蔵小杉)</option>
            </select>

            <select name="layout">
                <option value="">間取りを選択</option>
                <option value="1K" th:selected="${currentLayout == '1K'}">1K</option>
                <option value="1DK" th:selected="${currentLayout == '1DK'}">1DK</option>
                <option value="1LDK" th:selected="${currentLayout == '1LDK'}">1LDK</option>
                <option value="2DK" th:selected="${currentLayout == '2DK'}">2DK</option>
                <option value="2LDK" th:selected="${currentLayout == '2LDK'}">2LDK</option>
                <option value="3LDK" th:selected="${currentLayout == '3LDK'}">3LDK</option>
            </select>

            <select name="maxPrice">
                <option value="">家賃上限</option>
                <option value="80000" th:selected="${currentMaxPrice == 80000}">8万円以下</option>
                <option value="100000" th:selected="${currentMaxPrice == 100000}">10万円以下</option>
                <option value="150000" th:selected="${currentMaxPrice == 150000}">15万円以下</option>
                <option value="200000" th:selected="${currentMaxPrice == 200000}">20万円以下</option>
                <option value="300000" th:selected="${currentMaxPrice == 300000}">30万円以下</option>
            </select>

            <button type="submit">絞り込む</button>
            <a th:href="@{/property}" class="filter-reset">条件をリセット</a>
        </form>

        <details class="sort-dropdown">
            <summary>並び替え ▼</summary>
            <div class="sort-menu">
                <button type="button" onclick="sortCards('asc', event)">安い順</button>
                <button type="button" onclick="sortCards('desc', event)">高い順</button>
            </div>
        </details>

        <div class="card-list" id="cardList">
            <a th:each="p : ${properties}"
               th:href="@{/property/{id}(id=${p.id})}"
               th:attr="data-price=${p.price}, data-id=${p.id}"
               class="card-link">
                <div class="card">
                    <button type="button" class="favorite-btn" onclick="toggleFavorite(event, this)"><i data-lucide="star"></i></button>
                    <span class="badge" th:text="${p.layout}">1K</span>
                    <h2 th:text="${p.name}">物件名</h2>
                    <p class="price" th:text="${p.price}">家賃</p>
                    <div class="detail-item">
                        <i data-lucide="map-pin" class="inline-icon"></i> 所在地: <span th:text="${p.location}">住所</span>
                    </div>
                </div>
            </a>
        </div>
    </div>
</header>

<footer>
    <p>&copy; 2024 株式会社レジデンス東京. All Rights Reserved.</p>
    <p class="footer-links">
        <a th:href="@{/about}">会社概要</a> |
        <a th:href="@{/terms}">利用規約</a> |
        <a th:href="@{/privacy}">プライバシーポリシー</a>
    </p>
    <p class="portfolio-credit">
        本サイトはポートフォリオとして制作されたデモサイトです(Spring Boot学習用)。
        <a href="https://github.com/ozkit0103" target="_blank" rel="noopener">制作者: ozawa_dev (GitHub)</a>
    </p>
</footer>

</body>
</html>
